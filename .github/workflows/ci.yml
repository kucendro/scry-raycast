name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npx ray build --non-interactive --exit-on-error --environment dist --output ${{ runner.temp }}/raycast
        working-directory: extension
      - run: npx ray lint --non-interactive
        working-directory: extension
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test 'test/*.test.ts'
      - run: extension/node_modules/.bin/tsc -p test
